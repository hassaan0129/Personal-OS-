# Architecture, difficult debugging, security, and major refactors.
model = "gpt-5.6-sol"
model_reasoning_effort = "high"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
network_access = false

[features]
hooks = true
memories = true
multi_agent = true

[agents]
max_threads = 6
max_depth = 1
interrupt_message = true
